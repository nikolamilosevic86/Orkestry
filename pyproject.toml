[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orkestry"
version = "0.0.1"
description = "Agent orchestration and MCP tool discovery library."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Nikola Milosevic", email = "nikola@example.com" }
]
keywords = ["agents", "orchestration", "MCP", "tools", "discovery"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries"
]
dependencies = [
  # Add runtime deps here, e.g.:
  # "pydantic>=2.8",
  # "httpx>=0.27",
]

[project.optional-dependencies]
docs = [
  "sphinx>=7.0",
  "sphinx-rtd-theme>=2.0",
  "myst-parser>=2.0",
  "sphinx-autodoc-typehints>=2.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.10",
  "ruff>=0.6.0",
  "black>=24.8.0"
]

[project.urls]
Homepage = "https://github.com/nikolamilosevic86/Orkestry"
Repository = "https://github.com/nikolamilosevic86/Orkestry"
Issues = "https://github.com/nikolamilosevic86/Orkestry/issues"
Documentation = "https://nikolamilosevic86.github.io/Orkestry/"

[tool.setuptools]
# If your package code lives in src/, switch to packages.find and set package-dir
# For a flat layout (./orc), automatic discovery should work:
package-dir = { }

[tool.setuptools.packages.find]
where = ["."]
include = ["orc*"]

# -------------------------------
# Tooling configuration
# -------------------------------

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["orc", "tests"]

[tool.ruff.lint]
# Enable common rule sets: Pyflakes (F), Pycodestyle (E/W), isort (I),
# Pydocstyle (D) optional, Pyupgrade (UP), Ruff (RUF)
select = ["F", "E", "W", "I", "UP", "RUF"]
# Example ignores; tune for your style:
ignore = [
  "E203", # whitespace before ':' (conflicts with Black)
  "E501", # line length (formatter handles wrapping)
]
# Per-file ignores example:
# per-file-ignores = { "tests/**.py" = ["S101"] }

[tool.ruff.format]
# Use Ruff formatter; if staying with Black, you can omit this section
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# If you prefer Black instead of Ruff's formatter, keep Black enabled:
[tool.black]
target-version = ["py311"]
line-length = 100
include = "\\.pyi?$"
exclude = """
/(
  \\.git
| \\.venv
| _build
| build
| dist
)/
"""

# isort is handled by Ruff (I rules). If using standalone isort, configure here:
# [tool.isort]
# profile = "black"
# line_length = 100
# src_paths = ["orc", "tests"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
show_error_codes = true
plugins = []

# Package-level mypy options
[[tool.mypy.overrides]]
module = "orc.*"
ignore_missing_imports = true

# -------------------------------
# Pytest
# -------------------------------
[tool.pytest.ini_options]
addopts = "-ra -q --cov=orc --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]
